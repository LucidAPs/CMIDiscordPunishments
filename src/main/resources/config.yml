# Create a Discord bot, invite it to your server, and paste its token here.
# Enable Discord Developer Mode and copy the destination channel ID.
# The token is a secret and is never written to the server log.
discord:
  bot-token: ''
  channel-id: ''

# Available as the {server} message placeholder. Set this per server when using
# the same Discord channel for multiple Minecraft servers.
server-name: 'Minecraft Server'

delivery:
  connect-timeout-seconds: 5
  request-timeout-seconds: 10
  max-retries: 3
  queue-capacity: 250

# Each action can be disabled or given a different title, description, or color.
# Description entries are rendered as separate lines. A line is omitted when one
# of its placeholders has no value. Set description: [] for a title-only embed.
#
# Placeholders: {target}, {actor}, {reason}, {duration}, {server}, {category},
# {points}, {jail}, {cell}, {status}
#
# Colors must be six-digit RGB values. IP actions intentionally show the complete
# IP address.
events:
  test:
    enabled: true
    title: '✅ DISCORD BOT TEST'
    description:
      - 'Status: {status}'
      - 'Requested by: {actor}'
    color: '#3498DB'
  ban:
    enabled: true
    title: '🔨 {target} BANNED'
    description:
      - 'Reason: {reason}'
      - 'Duration: {duration}'
      - 'Banned by: {actor}'
    color: '#E74C3C'
  temp-ban:
    enabled: true
    title: '🔨 {target} TEMP-BANNED'
    description:
      - 'Reason: {reason}'
      - 'Duration: {duration}'
      - 'Banned by: {actor}'
    color: '#E67E22'
  ip-ban:
    enabled: true
    title: '⛔ {target} IP-BANNED'
    description:
      - 'Reason: {reason}'
      - 'Duration: {duration}'
      - 'Banned by: {actor}'
    color: '#C0392B'
  temp-ip-ban:
    enabled: true
    title: '⛔ {target} TEMP IP-BANNED'
    description:
      - 'Reason: {reason}'
      - 'Duration: {duration}'
      - 'Banned by: {actor}'
    color: '#D35400'
  unban:
    enabled: true
    title: '✅ {target} UNBANNED'
    description:
      - 'Unbanned by: {actor}'
    color: '#2ECC71'
  ip-unban:
    enabled: true
    title: '✅ {target} IP-UNBANNED'
    description:
      - 'Unbanned by: {actor}'
    color: '#27AE60'
  kick:
    enabled: true
    title: '👢 {target} KICKED'
    description:
      - 'Reason: {reason}'
      - 'Kicked by: {actor}'
    color: '#F1C40F'
  jail:
    enabled: true
    title: '🔒 {target} JAILED'
    description:
      - 'Reason: {reason}'
      - 'Duration: {duration}'
      - 'Jailed by: {actor}'
      - 'Jail: {jail}'
      - 'Cell: {cell}'
    color: '#E67E22'
  unjail:
    enabled: true
    title: '🔓 {target} RELEASED'
    description:
      - 'Released by: {actor}'
      - 'Jail: {jail}'
      - 'Cell: {cell}'
    color: '#2ECC71'
  mute:
    enabled: true
    title: '🔇 {target} MUTED'
    description:
      - 'Reason: {reason}'
      - 'Duration: {duration}'
      - 'Muted by: {actor}'
    color: '#9B59B6'
  unmute:
    enabled: true
    title: '🔊 {target} UNMUTED'
    description:
      - 'Unmuted by: {actor}'
    color: '#2ECC71'
  warn:
    enabled: true
    title: '⚠️ {target} WARNED'
    description:
      - 'Reason: {reason}'
      - 'Warned by: {actor}'
      - 'Category: {category}'
      - 'Points: {points}'
    color: '#F39C12'

# Built-in /mute, /unmute, /unjail, their cmi: namespaced forms, and
# /cmi <subcommand> are always recognized. Add direct custom alias labels here.
commands:
  aliases:
    mute: []
    unmute: []
    unjail: []
