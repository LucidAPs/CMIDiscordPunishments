name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify tag matches project version
        shell: bash
        run: |
          project_version="$(mvn --quiet --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "v${project_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Maven version ${project_version}." >&2
            exit 1
          fi

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: target/CMIDiscordPunishments-*.jar
